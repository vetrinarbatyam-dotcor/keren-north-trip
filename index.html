<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>טיול משפחת קרן בצפון</title>
<meta name="theme-color" content="#2f5d3a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f3ea;--card:#fff;--ink:#23301f;--mut:#667060;--g:#2f5d3a;--g2:#e3eed9;--acc:#d9822b;--line:#e2dccb}
@media(prefers-color-scheme:dark){:root:not([data-x]){--bg:#161c15;--card:#20291e;--ink:#eaf0e3;--mut:#a3ae9b;--g:#8fc99a;--g2:#2a3a28;--acc:#f0a050;--line:#334030}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Heebo,system-ui,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--g);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:10px}
header h1{font-size:1.05rem;margin:0;flex:1;font-weight:800}
.hotel{background:var(--acc);color:#fff;border:0;border-radius:99px;padding:8px 14px;font:inherit;font-weight:600;cursor:pointer;white-space:nowrap}
nav{position:sticky;top:52px;z-index:4;background:var(--card);border-bottom:1px solid var(--line);display:flex;overflow-x:auto;gap:4px;padding:6px 10px;scrollbar-width:none}
nav a{flex:none;padding:6px 12px;border-radius:99px;color:var(--ink);text-decoration:none;font-size:.93rem}
nav a.on{background:var(--g);color:#fff}
main{max-width:860px;margin:0 auto;padding:16px}
h2{margin:6px 0 4px}
.sub{color:var(--mut);margin:0 0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:0 0 12px}
.card h3{margin:0 0 4px;font-size:1.05rem}
.tag{display:inline-block;background:var(--g2);color:var(--g);border-radius:99px;padding:1px 10px;font-size:.8rem;margin-inline-end:4px}
.warn{background:#fff3d6;color:#6b4a00;border:1px solid #f0d58a;border-radius:12px;padding:10px 12px;margin:0 0 12px;font-size:.92rem}
@media(prefers-color-scheme:dark){.warn{background:#3a3115;color:#f3dd9c;border-color:#5c4e1d}}
.links{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.links a,.btn{background:var(--g2);color:var(--g);text-decoration:none;border-radius:8px;padding:5px 11px;font-size:.88rem;border:0;font-family:inherit;cursor:pointer}
.day{border-inline-start:5px solid var(--g);}
.slot{display:flex;gap:10px;padding:6px 0;border-top:1px dashed var(--line)}
.slot b{min-width:78px;color:var(--g)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.bird{padding:0;overflow:hidden}
.bird .im{aspect-ratio:4/3;background:var(--g2);display:flex;align-items:center;justify-content:center;font-size:2.4rem}
.bird img{width:100%;height:100%;object-fit:cover;display:block}
.bird .tx{padding:10px 12px}
.bird small{color:var(--mut);direction:ltr;display:block}
.shop label{display:flex;gap:10px;align-items:center;padding:5px 0;border-top:1px dashed var(--line)}
.shop input[type=checkbox]{width:20px;height:20px}
.shop textarea.it{min-height:0;resize:none;overflow:hidden;line-height:1.4;width:auto}.shop .it{flex:1;min-width:0;border:0;border-bottom:1px dashed transparent;background:transparent;font:inherit;color:inherit;padding:2px 4px}.shop .it:focus{border-bottom-color:var(--g);outline:0}.shop input[type=text].qty{width:76px;flex:none;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;padding:3px 6px;text-align:center}.shop .done{text-decoration:line-through;color:var(--mut)}
.shop form{display:flex;gap:6px;margin-top:8px}
.shop input[type=text],textarea{flex:1;font:inherit;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
textarea{width:100%;min-height:90px}
.x{margin-inline-start:auto;background:none;border:0;color:var(--mut);cursor:pointer;font-size:1.1rem}
.tl li{margin:6px 0}
section{display:none}section.on{display:block}

@media(max-width:600px){
 body{font-size:16px}
 header{padding:8px 12px;padding-top:max(8px,env(safe-area-inset-top))}
 header h1{font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
 .hotel{padding:10px 14px;min-height:44px}
 nav{top:60px;padding:6px 8px}
 nav a{padding:10px 14px;font-size:.95rem}
 main{padding:12px 12px calc(24px + env(safe-area-inset-bottom))}
 .card{padding:12px;border-radius:12px}
 .grid{grid-template-columns:repeat(2,1fr);gap:10px}
 .bird .tx{padding:8px 10px}.bird .tx h3{font-size:.98rem}.bird .tx p{font-size:.86rem;margin:4px 0 0}
 .slot{flex-direction:column;gap:0}.slot b{min-width:0}
 .links a,.btn{padding:10px 14px;font-size:.92rem}
 .shop label{flex-wrap:wrap;gap:8px 10px;padding:8px 0}
 .shop input[type=checkbox]{width:26px;height:26px;flex:none}
 .shop textarea.it{flex:1 1 0;min-width:0;font-size:16px}
 .shop input[type=text].qty{width:84px;min-height:40px;font-size:16px}
 .x{min-width:40px;min-height:40px;font-size:1.3rem}
 .shop form input[type=text]{min-height:44px;font-size:16px}
 textarea{font-size:16px}
}
@media(max-width:360px){.grid{grid-template-columns:1fr}}
.mode{display:flex;gap:6px;margin:0 0 12px;background:var(--g2);padding:4px;border-radius:12px}
.mode button{flex:1;border:0;border-radius:9px;padding:10px 6px;font:inherit;font-weight:600;background:transparent;color:var(--g);cursor:pointer}
.mode button.on{background:var(--g);color:#fff}
.cnt{font-size:.8rem;color:var(--mut);font-weight:400}
.shop span.it{flex:1;min-width:0;padding:2px 4px}
.shop .src{display:block;color:var(--mut);font-size:.75rem}
#sy{width:10px;height:10px;border-radius:50%;background:#9aa;flex:none}#sy.ok{background:#5fd16a}#sy.bad{background:#e0a050}
</style>

const st = {
  get(k,d){try{const v=localStorage.getItem('kn_'+k);return v?JSON.parse(v):d}catch(e){return d}},
  set(k,v){try{localStorage.setItem('kn_'+k,JSON.stringify(v))}catch(e){}}
};

/* ===== סנכרון בין מכשירים (Firebase Realtime Database, תוכנית חינמית, נתיב /trip בלבד) =====
   done/qty: ערך לכל פריט (המפתח מקודד, כי Firebase לא מקבל / . # $ [ ] במפתח) — כתיבה בודדת, בלי דריסה בין אנשים.
   shop2 (מבנה הרשימות) והערות האחוזה: אחרון כותב מנצח. ponytail: אין תור לעבודה בלי רשת, פעולות בלי אינטרנט לא נשמרות בענן. */
const DB='https://north-6b634-default-rtdb.firebaseio.com/trip';
const b64=k=>btoa(unescape(encodeURIComponent(k))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const unb64=k=>{k=k.replace(/-/g,'+').replace(/_/g,'/');while(k.length%4)k+='=';return decodeURIComponent(escape(atob(k)))};
let busy=0,lastW=0,needRender=false,hT;
const sy=ok=>{const e=document.getElementById('sy');if(e){e.className=ok?'ok':'bad';e.title=ok?'מסונכרן':'אין סנכרון'}};
const send=async(path,method,body)=>{busy++;lastW=Date.now();try{const r=await fetch(DB+path+'.json',{method,body:JSON.stringify(body)});sy(r.ok)}catch(e){sy(false)}finally{busy--;lastW=Date.now()}};
const encMap=(m,conv)=>{const o={};for(const k in m){const v=conv(m[k]);if(v!==null&&v!==undefined)o[b64(k)]=v}return o};
const _set=st.set;
st.set=(k,v)=>{
  const o=(k==='done'||k==='qty')?st.get(k,{}):null;
  _set(k,v);
  if(k==='done'||k==='qty'){
    const conv=k==='done'?(x=>x?true:null):(x=>x),p={};
    for(const f in v){if(v[f]!==o[f])p[b64(f)]=conv(v[f])}
    for(const f in o){if(!(f in v))p[b64(f)]=null}
    if(Object.keys(p).length)send('/'+k,'PATCH',p);
  }else if(k==='shop2')send('/shop2','PUT',JSON.stringify(v));
  else if(k==='hotelnote'){clearTimeout(hT);hT=setTimeout(()=>send('/hotelnote','PUT',v),800)}
};
const dec=o=>{const m={};for(const k in (o||{}))m[unb64(k)]=o[k];return m};
async function pull(first){
  if(busy||Date.now()-lastW<2500)return;
  try{
    const r=await fetch(DB+'.json');if(!r.ok)throw 0;
    const d=await r.json();sy(true);
    if(d===null){if(first)send('','PATCH',{shop2:JSON.stringify(st.get('shop2',SHOP0)),done:encMap(st.get('done',{}),x=>x?true:null),qty:encMap(st.get('qty',{}),x=>x),hotelnote:st.get('hotelnote','')});return}
    const put=(k,v)=>{if(JSON.stringify(st.get(k,null))!==JSON.stringify(v)){_set(k,v);needRender=true}};
    if(d.shop2)put('shop2',JSON.parse(d.shop2));
    put('done',dec(d.done));put('qty',dec(d.qty));
    if(typeof d.hotelnote==='string')put('hotelnote',d.hotelnote);
    if(needRender&&!/INPUT|TEXTAREA/.test((document.activeElement||{}).tagName||'')){needRender=false;render()}
  }catch(e){sy(false)}
}
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

R.supp = () => `<h2>ספקי אוכל</h2><p class="sub">פיצריות, קייטרינג וסופרים. שלחו לי רשימה ואוסיף.</p>` +
  Object.keys(SUPP).map(k=>`<div class="card"><h3>${SUPP[k].h}</h3>${EXTRA[k].map(e=>`<p><b>${esc(e.n)}</b> ${e.phone?`<a href="tel:${esc(e.phone)}">📞 ${esc(e.phone)}</a>`:''} ${e.u?`<a href="${e.u}" target="_blank" rel="noopener">🌐</a>`:''}<br>${esc(e.note||'')}</p>`).join('')}<div class="links">${SUPP[k].ph.map(r=>`<a href="${maps(r[1])}" target="_blank" rel="noopener">${esc(r[0])}</a>`).join('')}</div></div>`).join('') +
  `<div class="warn">לכ-16 איש: אצל כולם מלבד בית מנדיס לבדוק בטלפון אם יש משלוח ומתי מגיעים בשישי. לא נמצא ספק מאומת לחבילות מנגל או לסלי בוקר באזור — את על האש ובוקר קונים מהסופר.</div><div class="warn">בשישי והשבת רוב העסקים סגורים — קניות והזמנות מראש עד יום שישי בצהריים.</div>`;

const shopByMeal = () => {
  const data = st.get('shop2', SHOP0);
  const done = st.get('done', {}), qty = st.get('qty', {});
  return `<div class="shop">` +
   Object.keys(data).map((g,gi)=>`<div class="card"><h3>${esc(g)}</h3>${data[g].map((it,i)=>`<label><input type="checkbox" ${done[g+'|'+it]?'checked':''} onchange="tick(${gi},${i},this.checked)"><textarea rows="1" class="it ${done[g+'|'+it]?'done':''}" aria-label="שם הפריט" onchange="editItem(${gi},${i},this.value)" onkeydown="if(event.key==='Enter'){event.preventDefault();this.blur()}">${esc(it)}</textarea><input type="text" class="qty" inputmode="decimal" placeholder="כמות" value="${esc(qty[g+'|'+it]||'')}" aria-label="כמות" onchange="setQty(${gi},${i},this.value)"><button type="button" class="x" onclick="delItem(${gi},${i})" aria-label="מחק">✕</button></label>`).join('')}<form onsubmit="addItem(event,${gi})"><input type="text" placeholder="הוספת פריט" required><button class="btn">הוסף</button></form></div>`).join('') + `</div>`;
};

/* רשימה מרוכזת לפי נושא: סיווג לפי מילות מפתח. הסדר קובע — הראשון שמתאים מנצח. פריט שלא זוהה נכנס ל"אחר". */
const CATS = [
 ['🍕 הזמנות מוכנות',['פיצ']],
 ['🥩 בשר ועוף',['פרגיות','קבב','סטייק','שיפוד','נקניק','בשר','עוף','אנטריקוט']],
 ['🧀 חלב, ביצים וגבינות',['ביצים','גבינ','קוטג','פטה','לבנה','יוגורט','חלב','חמאה']],
 ['🥖 לחם ומאפים',['לחם','חלות','לחמני','פית','בגט']],
 ['🫙 ממרחים, סלטים מוכנים ושימורים',['חומוס','טחינה','מטבוחה','חציל','כרוב','ריבה','ממרח','טונה','זיתים','רטב']],
 ['🥬 ירקות ופירות',['מלפפונ','עגבניות','פלפל','בצל','עשבי','ירקות','חסה','סלט','תפוחי אדמה','בטטות','תירס','קלמנטינ','תפוחים','בננות','פירות']],
 ['🔥 ציוד מנגל',['פחמ','מצית','הדלקה','תבניות','מלקחיים','מלח','תבלינים']],
 ['🥤 שתייה, קפה ותה',['שתייה','מים','מיץ','יין','בירה','קפה','תה','סוכר']],
 ['🍿 נשנושים ומתוקים',['צ׳יפס','במבה','ביסלי','בייגלה','אגוזים','גרעינים','שוקולד','ופלים','עוגיות','עוגה','קינוח']],
 ['🧻 חד-פעמי ובסיס',['צלחות','כוסות','סכו','מפיות','שקיות','סבון','מגבות','נייר כסף','נרות']],
 ['📦 אחר',[]],
];
const catOf = it => (CATS.find(c=>c[1].some(k=>it.includes(k)))||CATS[CATS.length-1])[0];
const shopByTopic = () => {
  const data = st.get('shop2', SHOP0), done = st.get('done', {}), qty = st.get('qty', {});
  const by = {}; CATS.forEach(c=>by[c[0]]=[]);
  Object.keys(data).forEach((g,gi)=>data[g].forEach((it,i)=>by[catOf(it)].push({g,gi,it,i})));
  return `<div class="shop">`+CATS.filter(c=>by[c[0]].length).map(c=>{
    const rows=by[c[0]], n=rows.filter(r=>done[r.g+'|'+r.it]).length;
    return `<div class="card"><h3>${c[0]} <span class="cnt">${n}/${rows.length}</span></h3>${rows.map(r=>`<label><input type="checkbox" ${done[r.g+'|'+r.it]?'checked':''} onchange="tick(${r.gi},${r.i},this.checked)"><span class="it ${done[r.g+'|'+r.it]?'done':''}">${esc(r.it)}<small class="src">${esc(r.g)}</small></span><input type="text" class="qty" inputmode="decimal" placeholder="כמות" value="${esc(qty[r.g+'|'+r.it]||'')}" aria-label="כמות" onchange="setQty(${r.gi},${r.i},this.value)"></label>`).join('')}</div>`}).join('')+`</div>`;
};
R.shop = () => {
  const m = st.get('shopmode','meal');
  return `<h2>רשימות קניות</h2><p class="sub">סמנו מה נקנה. נשמר במכשיר.</p><div class="mode" role="tablist"><button class="${m==='meal'?'on':''}" onclick="setMode('meal')">🍽️ לפי ארוחות</button><button class="${m==='topic'?'on':''}" onclick="setMode('topic')">🧺 מרוכז לפי נושא</button></div>`+(m==='topic'?shopByTopic():shopByMeal());
};
window.setMode=m=>{st.set('shopmode',m);render()};
const keys = () => Object.keys(st.get('shop2', SHOP0));
window.tick=(gi,i,v)=>{const d=st.get('shop2',SHOP0),g=keys()[gi],c=st.get('done',{});c[g+'|'+d[g][i]]=v;st.set('done',c);render()};
window.editItem=(gi,i,v)=>{v=v.trim();const d=st.get('shop2',SHOP0),g=keys()[gi],c=st.get('done',{}),o=d[g][i];if(!v){return render()}d[g][i]=v;if(c[g+'|'+o]){delete c[g+'|'+o];c[g+'|'+v]=true;st.set('done',c)}const q=st.get('qty',{});if(q[g+'|'+o]){q[g+'|'+v]=q[g+'|'+o];delete q[g+'|'+o];st.set('qty',q)}st.set('shop2',d);render()};
window.setQty=(gi,i,v)=>{const d=st.get('shop2',SHOP0),k=keys()[gi]+'|'+d[keys()[gi]][i],q=st.get('qty',{});v=v.trim();if(v)q[k]=v;else delete q[k];st.set('qty',q)};
window.delItem=(gi,i)=>{const d=st.get('shop2',SHOP0),g=keys()[gi],q=st.get('qty',{});delete q[g+'|'+d[g][i]];st.set('qty',q);d[g].splice(i,1);st.set('shop2',d);render()};
window.addItem=(e,gi)=>{e.preventDefault();const v=e.target.querySelector('input').value.trim();if(!v)return;const d=st.get('shop2',SHOP0);d[keys()[gi]].push(v);st.set('shop2',d);render()};

R.nature = () => `<h2>טבע ונוף בצפון</h2><p class="sub">מה כדאי לדעת לפני</p>` + NATURE.map(n=>`<div class="card"><h3>${n[0]}</h3><p>${esc(n[1])}</p></div>`).join('');

const gallery = (arr,icon) => `<div class="grid">${arr.map(b=>`<div class="card bird"><div class="im"><img src="img/${esc(b[2])}.jpg" alt="${esc(b[0])}" loading="lazy" onerror="this.parentNode.textContent='${icon}'"></div><div class="tx"><h3>${esc(b[0])}</h3><small>${esc(b[1])}</small><p>${esc(b[3])}</p></div></div>`).join('')}</div>`;
R.birds = () => `<h2>מגדיר ציפורים, חי וצומח</h2><p class="sub">מה אפשר לראות באגמון ובעמק (חורף). </p><h3>🦆 ציפורים</h3>${gallery(BIRDS,'🐦')}<h3>🐾 בעלי חיים</h3>${gallery(ANIMALS,'🐾')}<h3>🌿 צמחים</h3>${gallery(PLANTS,'🌱')}<p class="sub" style="margin-top:14px">תמונות: ויקיפדיה / Wikimedia Commons (רישיונות חופשיים, צלמים שונים).</p>`;

R.hist = () => `<h2>היסטוריה מקומית</h2><p class="sub">ראש פינה · יסוד המעלה · שדה אליעזר · עמק החולה</p>${HX.map(x=>`<div class="card"><h3>${x[1]} ${esc(x[0])}</h3><ul class="tl">${x[2].map(i=>`<li>${esc(i)}</li>`).join('')}</ul></div>`).join('')}<div class="card day"><h3>⏳ ציר זמן</h3><ul class="tl">${HIST.map(h=>`<li><b>${esc(h[0])}</b> — ${esc(h[1])}</li>`).join('')}</ul></div><div class="warn">הנתונים מסוכמים ממקורות באינטרנט והמקורות לא תמיד מסכימים בפרטים (מספרי משפחות, שנות הקמה). לאמת לפני שמצטטים.</div><div class="card"><h3>מקורות</h3><div class="links">${SRC.map(r=>`<a href="${r[1]}" target="_blank" rel="noopener">${esc(r[0])}</a>`).join('')}</div></div>`;

R.hotel = () => {
  const full = `${HOTEL.name} ${HOTEL.place}`;
  return `<h2>${esc(HOTEL.name)}</h2><p class="sub">${esc(HOTEL.place)}</p><div class="card"><div class="links">${L(full,'📍 פתח במפה')}</div><h3 style="margin-top:14px">הערות (קוד כניסה, טלפון מארח, שעות…)</h3><textarea id="hn" placeholder="כתבו כאן, נשמר במכשיר">${esc(st.get('hotelnote',''))}</textarea></div>`;
};

function render(top){
  const h=(location.hash||'#plan').slice(1), k=R[h]?h:'plan';
  document.getElementById('main').innerHTML=R[k]();
  document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('on',a.dataset.k===k));
  const on=document.querySelector('#nav a.on'); if(on)on.scrollIntoView({inline:'center',block:'nearest'});
  document.querySelectorAll('textarea.it').forEach(t=>{const f=()=>{t.style.height='auto';t.style.height=t.scrollHeight+'px'};f();t.addEventListener('input',f)});
  const hn=document.getElementById('hn'); if(hn)hn.oninput=()=>st.set('hotelnote',hn.value);
  if(top===true)scrollTo(0,0);
}
window.go=k=>{location.hash=k};
document.getElementById('nav').innerHTML=TABS.map(t=>`<a href="#${t[0]}" data-k="${t[0]}">${t[1]}</a>`).join('');
addEventListener('hashchange',()=>render(true));
render();
pull(true);setInterval(pull,6000);
addEventListener('visibilitychange',()=>{if(!document.hidden)pull()});
</script>
</body>
</html>
